<!DOCTYPE html>
<html lang="pt" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serviços em Ilhabela • Ilhabela Interactive Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet" />
  <script>tailwind.config={theme:{extend:{colors:{primary:'#003345','primary-container':'#004b63',secondary:'#3b6934','secondary-container':'#b9eeab',surface:'#fbf9f4','surface-container':'#f0eee9','on-surface':'#1b1c19','on-surface-variant':'#40484c'}}}}</script>
  <link rel="stylesheet" href="/styles.css?v=4.0" />
</head>
<body class="bg-surface text-on-surface min-h-screen antialiased">
  <header class="sticky top-0 z-40 glass-panel border-b border-black/5 px-4 md:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <a href="/" class="flex items-center gap-2.5">
        <div class="brand-mark w-10 h-10 rounded-full text-white flex items-center justify-center shadow-md"><span class="material-symbols-outlined">sailing</span></div>
        <div><strong class="text-xl text-primary font-heading">Ilhabela</strong><span class="hidden sm:inline text-xs font-semibold text-secondary ml-2">Guia Interativo</span></div>
      </a>
      <a href="/" class="px-3 py-2 rounded-xl border border-black/10 text-xs font-bold text-primary flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">arrow_back</span><span id="services-back">Atrações</span></a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">
    <section class="max-w-3xl mb-7">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-secondary-container/60 text-secondary text-xs font-bold uppercase tracking-wider mb-3"><span class="material-symbols-outlined text-[16px]">concierge</span><span id="services-badge">Serviços úteis</span></div>
      <h1 id="services-title" class="text-3xl md:text-5xl font-extrabold text-primary font-heading">Serviços em Ilhabela</h1>
      <p id="services-subtitle" class="text-sm md:text-base text-on-surface-variant mt-2">Alimentação, passeios, hospedagem e outros serviços para complementar sua visita.</p>
    </section>

    <section class="rounded-2xl bg-white border border-black/5 shadow-sm p-4 mb-6 space-y-4">
      <div id="services-page-filters" class="flex gap-2 overflow-x-auto pb-1"></div>
      <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
        <button id="services-nearby" type="button" class="min-h-11 px-4 rounded-xl bg-primary text-white text-xs font-bold flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[18px]">my_location</span><span>Usar minha localização</span></button>
        <div id="services-distance-wrap" class="hidden flex items-center gap-2 overflow-x-auto">
          <span id="services-distance-label" class="text-xs font-bold text-on-surface-variant shrink-0">Distância:</span>
          <select id="services-distance" class="min-h-11 px-3 rounded-xl border border-black/10 bg-surface text-xs font-bold text-primary">
            <option value="all">Todos</option><option value="1">Até 1 km</option><option value="3">Até 3 km</option><option value="5">Até 5 km</option><option value="10">Até 10 km</option>
          </select>
        </div>
      </div>
      <p id="services-location-note" class="hidden text-[11px] text-on-surface-variant">As distâncias são aproximadas, calculadas pela localização editorial de referência de cada serviço.</p>
    </section>

    <div id="services-page-status" class="text-xs text-on-surface-variant mb-4"></div>
    <section id="services-page-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></section>
  </main>

  <script src="/translations.js?v=4.0"></script>
  <script src="/data.js?v=4.0"></script>
  <script src="/additional-spots.js?v=4.0"></script>
  <script>
    window.servicesDirectoryData = {
      translations: typeof translations !== 'undefined' ? translations : {},
      touristSpots: typeof touristSpots !== 'undefined' ? touristSpots : [],
      servicesData: typeof servicesData !== 'undefined' ? servicesData : []
    };
  </script>
  <script src="/services-page.js?v=1.1"></script>
</body>
</html>
