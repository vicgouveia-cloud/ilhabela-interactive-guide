name: Venue photo card presentation validation
on:
  push:
    branches:
      - feat/services-hostel-vila-experiences
    paths:
      - .github/workflows/venue-credit-presentation-check.yml
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check syntax, service data, image provenance
        run: |
          node --check services-directory.js
          node --check additional-spots.js
          node tests/audit-hostel-vila-services.cjs
      - run: npx playwright install --with-deps chromium
      - name: Check service photo presentation, badges, CTAs and locale responsive behavior
        run: npx playwright test tests/services-global-actions.spec.cjs tests/services-hostel-vila.spec.cjs tests/services-recanto-gaya.spec.cjs tests/services-recommendation-badges.spec.cjs --trace=off --workers=3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: venue-photo-card-check
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
