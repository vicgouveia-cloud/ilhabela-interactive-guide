name: IMG-01A photo source consolidation audit

on:
  push:
    branches:
      - fix/img-01a-photo-source-consolidation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-photos-seo-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate syntax of changed source files
        run: |
          node --check attraction-photos.js
          node --check scripts/generate-attraction-pages.cjs
          node --check tests/audit-attraction-images.cjs
          node --check tests/audit-reconciled-attractions.cjs
      - name: SEO and generated page regression suite
        run: npm run test:seo
      - name: Internationalization audit
        if: always()
        run: npm run test:audit
      - name: Confirm whether the itinerary failure exists at the originating main
        if: failure()
        run: |
          git worktree add --detach /tmp/img-01a-base eb8fd9cde593348e2e8199c2b1cd4279dd71acbf
          set +e
          (cd /tmp/img-01a-base && node tests/audit-itinerary-hubs.cjs)
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::warning::Itinerary regression reproduces at originating main; outside IMG-01A scope"
          else
            echo "::error::Itinerary failure appears introduced by this branch"
            exit 1
          fi
