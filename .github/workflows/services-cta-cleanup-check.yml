name: Services directory CTA and removal regression
on:
  push:
    branches:
      - feat/services-hostel-vila-experiences
    paths:
      - .github/workflows/services-cta-cleanup-check.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate service catalog and JavaScript
        run: |
          node --check additional-spots.js
          node --check services-directory.js
          node --check app.js
          node tests/audit-hostel-vila-services.cjs
      - run: npx playwright install --with-deps chromium
      - name: Validate CTA widths, ordering, removal, five languages and contact
        run: npx playwright test tests/services-global-actions.spec.cjs tests/services-recanto-gaya.spec.cjs tests/services-hostel-vila.spec.cjs tests/services-recommendation-badges.spec.cjs tests/contact.spec.cjs --trace=off --workers=3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: directory-cta-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
