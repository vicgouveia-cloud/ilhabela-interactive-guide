name: IMG-PREFEITURA-01 five-language browser verification
on:
  push:
    branches:
      - feat/img-prefeitura-01-3praias
    paths:
      - .github/workflows/img-prefeitura-01-browser.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify three authorized photographs across PT EN ES FR HE, 320 390 1440 and static pages
        run: npx playwright test tests/img-prefeitura-01-browser.spec.cjs --trace=off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: img-prefeitura-01-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
