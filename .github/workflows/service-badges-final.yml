name: Service recommended badges final verification
on:
  push:
    branches:
      - feat/services-hostel-vila-experiences
    paths:
      - .github/workflows/service-badges-final.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Static catalog and source syntax
        run: |
          node --check additional-spots.js
          node --check services-directory.js
          node tests/audit-hostel-vila-services.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify two previously featured services and Floresta Bar
        run: npx playwright test tests/services-recommendation-badges.spec.cjs tests/services-hostel-vila.spec.cjs --trace=off --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-badges-test-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
# Rerun: historic audit updated after Floresta Bar compact sizing approval.
