name: Recanto de Gaya directory validation
on:
  push:
    branches:
      - feat/services-hostel-vila-experiences
    paths:
      - .github/workflows/services-recanto-gaya-check.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit new data and existing service catalog
        run: |
          node --check additional-spots.js
          node --check services-directory.js
          node tests/audit-hostel-vila-services.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify Instagram-first Recanto de Gaya and existing cards
        run: npx playwright test tests/services-recanto-gaya.spec.cjs tests/services-recommendation-badges.spec.cjs tests/services-hostel-vila.spec.cjs --trace=off --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: services-recanto-gaya-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
# Run after Instagram CTA assertion was aligned with existing icon markup.
