name: Temporary waterfall safety regression
on:
  push:
    branches: [fix/cat-safety-01-state-park]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/audit-attraction-safety.cjs
      - run: npm test
