name: Mobile journey audit
on:
  push:
    branches: [fix/mobile-map-choose-trip]
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check changed JavaScript syntax
        run: |
          node --check app.js
          node --check planner.js
          node --check translations.js
          node --check bottom-nav.js
      - name: Validate mobile, desktop, five languages and routing regressions
        run: npx playwright test tests/mobile-journey.spec.cjs tests/home-planner.spec.cjs tests/multimodal.spec.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-journey-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
